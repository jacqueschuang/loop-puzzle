<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>環排九宮 · 滑動數字</title>
<style>
  :root{
    --felt-1:#12503f;
    --felt-2:#0a3128;
    --wood:#4a3524;
    --wood-hi:#6b4d34;
    --ivory:#f7f2e5;
    --ivory-2:#e6dcc5;
    --ink:#22251f;
    --red:#b8342b;
    --cell:104px;
    --gap:9px;
    --pad:28px;
    --n:3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
    background:
      radial-gradient(120% 90% at 50% 0%, #1b6450 0%, var(--felt-1) 38%, var(--felt-2) 100%);
    background-attachment:fixed;
    color:var(--ivory);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
    background-size:3px 3px;
  }
  .app{margin:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:30px}
  .game{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}

  /* ---------- 排行榜 ---------- */
  .side{width:min(300px,90vw)}
  .rank{
    border-radius:14px;padding:14px 16px 12px;
    background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.16));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.28);
  }
  .rank-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .rank-tools{display:flex;gap:6px}
  .rank-head h3{margin:0;font-size:15px;font-weight:600;letter-spacing:.09em}
  .rank-head h3 span{font-size:12px;font-weight:500;color:rgba(230,244,238,.45);letter-spacing:.06em}
  .mini{
    font:inherit;font-size:11px;cursor:pointer;padding:4px 10px;border:0;border-radius:999px;
    background:transparent;color:rgba(230,244,238,.7);box-shadow:inset 0 0 0 1px rgba(230,244,238,.25);
  }
  .mini:hover{color:#12362c;background:#dccfae;box-shadow:none}
  .mini:focus-visible{outline:2px solid #ffe6a8;outline-offset:2px}
  .rank-list{list-style:none;margin:0;padding:0;max-height:min(46vh,320px);overflow:auto}
  .rank-list li{
    display:grid;grid-template-columns:22px 1fr auto;column-gap:10px;row-gap:3px;
    align-items:baseline;padding:8px 6px;font-size:13px;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .rank-list .r{grid-row:1/3;align-self:center}
  .rank-list .nm{grid-column:2;grid-row:1}
  .rank-list .ms{grid-column:3;grid-row:1}
  .rank-list .meta{
    grid-column:2/4;grid-row:2;display:flex;gap:7px;
    font-size:10.5px;color:rgba(230,244,238,.36);font-variant-numeric:tabular-nums;
  }
  .rank-list li:last-child{border-bottom:0}
  .rank-list .r{color:rgba(230,244,238,.42);font-variant-numeric:tabular-nums}
  .rank-list .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.05em}
  .rank-list .ms{font-variant-numeric:tabular-nums;font-weight:640}
  .rank-list li.top .r,.rank-list li.top .ms{color:#ffe6a8}
  .rank-list li.me{background:rgba(255,230,168,.14);border-radius:7px;border-bottom-color:transparent}
  .rank-list .tag{
    color:#ffd48a;background:rgba(255,212,138,.14);
    padding:0 5px;border-radius:4px;font-size:10px;
  }
  .rank-list li.msg{display:block;text-align:center;padding:20px 6px;border:0;color:rgba(230,244,238,.45);line-height:1.6}
  .rank-foot{margin:10px 0 0;font-size:11px;line-height:1.6;color:rgba(230,244,238,.38)}

  /* ---------- 計時列 ---------- */
  .hud{
    display:flex;align-items:flex-end;gap:22px;
    padding:10px 20px 11px;border-radius:10px;
    background:linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.16));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 10px rgba(0,0,0,.25);
  }
  .stat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px}
  .stat b{
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
    font-size:15px;font-weight:600;letter-spacing:.02em;color:#cfe5d9;
  }
  .stat.time b{font-size:30px;font-weight:650;color:var(--ivory);line-height:1}
  .stat span{font-size:11px;color:rgba(224,240,232,.55);letter-spacing:.14em}

  /* ---------- 牌桌 ---------- */
  .table{
    position:relative;
    padding:var(--pad);
    border-radius:18px;
    background:linear-gradient(160deg,var(--wood-hi),var(--wood) 45%,#33231704 100%),var(--wood);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.18),
      inset 0 -2px 6px rgba(0,0,0,.45),
      0 18px 40px rgba(0,0,0,.45);
  }
  .board{
    position:relative;
    width:calc(var(--cell)*var(--n));height:calc(var(--cell)*var(--n));
    overflow:hidden;border-radius:8px;
    background:#0a2c23;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.6);
    touch-action:none;cursor:grab;
  }
  .board.dragging{cursor:grabbing}
  .socket{
    position:absolute;width:var(--cell);height:var(--cell);
    padding:calc(var(--gap)/2);
  }
  .socket i{display:block;width:100%;height:100%;border-radius:9px;background:rgba(0,0,0,.22)}

  .tile{position:absolute;width:var(--cell);height:var(--cell);padding:calc(var(--gap)/2);will-change:transform}
  .face{
    width:100%;height:100%;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#fffdf6 0%,var(--ivory) 40%,var(--ivory-2) 100%);
    box-shadow:
      inset 0 1px 0 #fff,
      inset 0 -3px 0 rgba(150,133,98,.45),
      0 3px 6px rgba(0,0,0,.35);
    color:var(--ink);
    font-size:calc(var(--cell)*.46);font-weight:640;line-height:1;
    font-variant-numeric:tabular-nums;
    text-shadow:0 1px 0 rgba(255,255,255,.9);
    user-select:none;
  }
  .tile[data-n="1"] .face{color:var(--red)}
  .tile.ghost{opacity:1;pointer-events:none}
  .board.hint .tile.ok .face{
    background:linear-gradient(180deg,#f4fbf2 0%,#e2f0dc 45%,#cfe3c6 100%);
    box-shadow:inset 0 1px 0 #fff, inset 0 -3px 0 rgba(107,138,94,.5), 0 3px 6px rgba(0,0,0,.35);
  }

  /* ---------- 木框上的方向鍵 ---------- */
  .nub{
    position:absolute;width:24px;height:24px;padding:0;border:0;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#d7b779,#9c7b45 70%,#6d5329);
    box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);
    cursor:pointer;display:grid;place-items:center;opacity:.55;transition:opacity .15s,transform .15s;
  }
  .nub:hover,.nub:focus-visible{opacity:1;transform:scale(1.12)}
  .nub:focus-visible{outline:2px solid #ffe6a8;outline-offset:2px}
  .nub svg{width:11px;height:11px;fill:#402e14}

  /* ---------- 控制列 ---------- */
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .seg{display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
  .seg button{
    font:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;cursor:pointer;
    padding:6px 15px;border:0;border-radius:999px;background:transparent;color:rgba(230,244,238,.6);
  }
  .seg button[aria-pressed="true"]{
    color:#12362c;background:linear-gradient(180deg,#f3ecd9,#dccfae);
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .seg button:focus-visible{outline:2px solid #ffe6a8;outline-offset:2px}
  .btn{
    font:inherit;font-size:14px;font-weight:600;color:#12362c;
    padding:9px 18px;border:0;border-radius:999px;cursor:pointer;
    background:linear-gradient(180deg,#f3ecd9,#dccfae);
    box-shadow:0 2px 0 #9d8a5f,0 6px 14px rgba(0,0,0,.3);
    transition:transform .08s,box-shadow .08s;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 0 0 #9d8a5f,0 3px 8px rgba(0,0,0,.3)}
  .btn.quiet{
    background:transparent;color:rgba(230,244,238,.7);
    box-shadow:inset 0 0 0 1px rgba(230,244,238,.28);
  }
  .btn.quiet[aria-pressed="true"]{color:#12362c;background:linear-gradient(180deg,#f3ecd9,#dccfae);box-shadow:none}
  .btn:focus-visible{outline:2px solid #ffe6a8;outline-offset:3px}

  .rule{
    max-width:min(430px,88vw);text-align:center;line-height:1.7;
    font-size:13px;color:rgba(222,240,232,.62);margin:0;
  }
  .rule kbd{
    font:inherit;font-size:12px;padding:1px 6px;border-radius:5px;
    background:rgba(255,255,255,.1);color:#eaf5ef;
  }

  /* ---------- 完成 ---------- */
  .win{
    position:absolute;inset:0;z-index:5;border-radius:18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:rgba(8,38,30,.88);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:opacity .28s;
  }
  .win.on{opacity:1;visibility:visible}
  .win .entry{display:flex;gap:8px;margin-top:2px}
  .win input{
    font:inherit;font-size:15px;font-weight:600;letter-spacing:.12em;text-align:center;
    width:126px;padding:9px 12px;border:0;border-radius:999px;
    background:rgba(255,255,255,.1);color:var(--ivory);
    box-shadow:inset 0 0 0 1px rgba(230,244,238,.32);
  }
  .win input::placeholder{letter-spacing:.02em;color:rgba(230,244,238,.4);font-weight:400}
  .win input:focus{outline:2px solid #ffe6a8;outline-offset:1px}
  .win .note{margin:4px 0 8px;font-size:11px;color:rgba(222,240,232,.55);min-height:15px}
  .win h2{margin:0;font-size:20px;font-weight:600;letter-spacing:.06em}
  .win .big{
    font-size:46px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1;
    color:#ffe6a8;
  }
  .win p{margin:0 0 10px;font-size:13px;color:rgba(222,240,232,.7)}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<div class="game">

  <div class="hud">
    <div class="stat"><span>步數</span><b id="moves">0</b></div>
    <div class="stat time"><span>計時</span><b id="time">0.00</b></div>
    <div class="stat"><span>最佳</span><b id="best">—</b></div>
  </div>

  <div class="table" id="table">
    <div class="board" id="board" aria-label="九宮數字盤"></div>
    <div class="win" id="win">
      <h2>完成</h2>
      <div class="big" id="winTime">0.00</div>
      <p id="winSub">共 0 步</p>
      <div class="entry">
        <input id="who" maxlength="8" placeholder="輸入代號" autocomplete="off"
               spellcheck="false" aria-label="玩家代號，限英文與數字 1 到 8 字">
        <button class="btn" id="post" disabled>登錄成績</button>
      </div>
      <p class="note" id="note">英數 1–8 字</p>
      <button class="btn quiet" id="again">再來一局</button>
    </div>
  </div>

  <div class="controls">
    <div class="seg" id="modeSeg" role="group" aria-label="盤面大小">
      <button type="button" data-n="3" aria-pressed="true">3×3</button>
      <button type="button" data-n="4" aria-pressed="false">4×4</button>
    </div>
    <button class="btn" id="shuffle">重新打亂</button>
    <button class="btn quiet" id="hint" aria-pressed="true">歸位提示</button>
  </div>

  <p class="rule">
    整排拖曳：橫排左右滑、直排上下滑，推出去的方塊會從另一端繞回來。<br>
    把 <kbd>1</kbd> 到 <kbd id="ruleMax">9</kbd> 從左上排到右下，用最短的時間。
  </p>
</div>

<aside class="side">
  <div class="rank">
    <div class="rank-head">
      <h3>排行榜 <span id="rankMode">3×3</span></h3>
      <div class="rank-tools">
        <button class="mini" id="copy">複製 JSON</button>
        <button class="mini" id="load">匯入檔案</button>
        <input type="file" id="file" accept=".json,application/json" hidden>
      </div>
    </div>
    <ol class="rank-list" id="rankList"><li class="msg">讀取中…</li></ol>
    <p class="rank-foot" id="rankFoot">只顯示前 10 名，每個代號留最快的一局。成績共用，其他玩家也看得到。</p>
  </div>
</aside>
</div>

<script>
(() => {
  const root    = document.documentElement;
  const board   = document.getElementById('board');
  const table   = document.getElementById('table');
  const elMoves = document.getElementById('moves');
  const elTime  = document.getElementById('time');
  const elBest  = document.getElementById('best');
  const win     = document.getElementById('win');

  let N = 3, cell = 104;
  let state = [], tiles = {}, sockets = [], nubs = [];
  let moves = 0, startAt = 0, timerId = null, running = false;
  let busy = false, solved = false, best = null;

  /* ---------- 尺寸 ---------- */
  function resize() {
    const wide = window.innerWidth >= 880;
    const w = Math.min(window.innerWidth - (wide ? 430 : 88), 470);
    const h = window.innerHeight - (wide ? 290 : 350);
    cell = Math.max(52, Math.min(N === 3 ? 118 : 94, Math.floor(Math.min(w, h) / N)));
    root.style.setProperty('--cell', cell + 'px');
    root.style.setProperty('--gap', (N === 3 ? 9 : 7) + 'px');
    root.style.setProperty('--pad', Math.max(24, Math.min(34, Math.round(cell * 0.3))) + 'px');
    layoutNubs();
    render();
  }
  window.addEventListener('resize', resize);

  /* ---------- 建立盤面 ---------- */
  const xy = s => ({ x: (s % N) * cell, y: Math.floor(s / N) * cell });

  function build() {
    board.innerHTML = '';
    tiles = {}; sockets = [];
    state = Array.from({ length: N * N }, (_, i) => i + 1);
    for (let i = 0; i < N * N; i++) {
      const s = document.createElement('div');
      s.className = 'socket';
      s.innerHTML = '<i></i>';
      board.appendChild(s);
      sockets.push(s);
    }
    for (let n = 1; n <= N * N; n++) {
      const t = document.createElement('div');
      t.className = 'tile';
      t.dataset.n = n;
      t.innerHTML = `<div class="face">${n}</div>`;
      tiles[n] = t;
      board.appendChild(t);
    }
    buildNubs();
  }

  function render() {
    if (!state.length) return;
    sockets.forEach((s, i) => {
      const p = xy(i);
      s.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;
    });
    for (let i = 0; i < N * N; i++) {
      const el = tiles[state[i]], p = xy(i);
      el.style.transition = 'none';
      el.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;
      el.classList.toggle('ok', state[i] === i + 1);
    }
    void board.offsetWidth;
  }

  /* ---------- 模型 ---------- */
  const lineSlots = (axis, idx) =>
    Array.from({ length: N }, (_, k) => axis === 'row' ? idx * N + k : idx + k * N);

  function applyShift(axis, idx, steps) {
    const s = ((steps % N) + N) % N;
    if (!s) return;
    const slots = lineSlots(axis, idx);
    const nums = slots.map(i => state[i]);
    slots.forEach((_, i) => { state[slots[(i + s) % N]] = nums[i]; });
  }

  const isSolved = () => state.every((n, i) => n === i + 1);

  /* ---------- 整排動畫（含頭尾分身） ---------- */
  function beginLine(axis, idx) {
    const slots = lineSlots(axis, idx);
    const items = [];
    slots.forEach(slot => {
      const el = tiles[state[slot]], base = xy(slot);
      items.push({ el, base });
      for (const k of [-N, N]) {
        const g = el.cloneNode(true);
        g.classList.add('ghost');
        const gb = axis === 'row'
          ? { x: base.x + k * cell, y: base.y }
          : { x: base.x, y: base.y + k * cell };
        g.style.transform = `translate3d(${gb.x}px,${gb.y}px,0)`;
        board.appendChild(g);
        items.push({ el: g, base: gb, ghost: true });
      }
    });
    return { axis, idx, items };
  }

  function offsetLine(h, d) {
    for (const it of h.items) {
      const x = it.base.x + (h.axis === 'row' ? d : 0);
      const y = it.base.y + (h.axis === 'col' ? d : 0);
      it.el.style.transition = 'none';
      it.el.style.transform = `translate3d(${x}px,${y}px,0)`;
    }
  }

  function endLine(h, steps, dur = 190) {
    busy = true;
    const d = steps * cell;
    void board.offsetWidth;
    for (const it of h.items) {
      const x = it.base.x + (h.axis === 'row' ? d : 0);
      const y = it.base.y + (h.axis === 'col' ? d : 0);
      it.el.style.transition = `transform ${dur}ms cubic-bezier(.22,.68,.32,1.02)`;
      it.el.style.transform = `translate3d(${x}px,${y}px,0)`;
    }
    setTimeout(() => {
      h.items.forEach(it => { if (it.ghost) it.el.remove(); });
      if (steps) { applyShift(h.axis, h.idx, steps); bumpMove(); }
      render();
      busy = false;
      if (steps) checkWin();
    }, dur + 20);
  }

  function shift(axis, idx, steps) {
    if (busy || solved) return;
    endLine(beginLine(axis, idx), steps);
  }

  /* ---------- 拖曳 ---------- */
  let drag = null;
  board.addEventListener('pointerdown', e => {
    if (busy || solved) return;
    const r = board.getBoundingClientRect();
    const col = Math.floor((e.clientX - r.left) / cell);
    const row = Math.floor((e.clientY - r.top) / cell);
    if (col < 0 || col >= N || row < 0 || row >= N) return;
    board.setPointerCapture(e.pointerId);
    board.classList.add('dragging');
    drag = { x: e.clientX, y: e.clientY, row, col, h: null, d: 0 };
  });

  board.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.h) {
      if (Math.hypot(dx, dy) < 7) return;
      const axis = Math.abs(dx) > Math.abs(dy) ? 'row' : 'col';
      drag.h = beginLine(axis, axis === 'row' ? drag.row : drag.col);
    }
    const raw = drag.h.axis === 'row' ? dx : dy;
    const lim = (N - 1) * cell + cell * 0.4;
    drag.d = Math.max(-lim, Math.min(lim, raw));
    offsetLine(drag.h, drag.d);
  });

  function release() {
    if (!drag) return;
    board.classList.remove('dragging');
    const h = drag.h, d = drag.d;
    drag = null;
    if (!h) return;
    let steps = Math.round(d / cell);
    steps = Math.max(-(N - 1), Math.min(N - 1, steps));
    endLine(h, steps, steps === 0 ? 150 : 190);
  }
  board.addEventListener('pointerup', release);
  board.addEventListener('pointercancel', release);

  /* ---------- 木框方向鍵 ---------- */
  const arrow = {
    up:   'M8 2 L14 12 L2 12 Z', down: 'M8 14 L14 4 L2 4 Z',
    left: 'M2 8 L12 14 L12 2 Z', right:'M14 8 L4 14 L4 2 Z'
  };
  const label = { left: '橫排左移', right: '橫排右移', up: '直排上移', down: '直排下移' };

  function buildNubs() {
    nubs.forEach(n => n.el.remove());
    nubs = [];
    for (let i = 0; i < N; i++) {
      for (const dir of ['left', 'right', 'up', 'down']) {
        const b = document.createElement('button');
        b.className = 'nub';
        b.setAttribute('aria-label', `第 ${i + 1} ${label[dir]}`);
        b.innerHTML = `<svg viewBox="0 0 16 16"><path d="${arrow[dir]}"/></svg>`;
        b.addEventListener('click', () => {
          if (dir === 'left')  shift('row', i, -1);
          if (dir === 'right') shift('row', i, 1);
          if (dir === 'up')    shift('col', i, -1);
          if (dir === 'down')  shift('col', i, 1);
        });
        table.appendChild(b);
        nubs.push({ el: b, dir, i });
      }
    }
    layoutNubs();
  }

  function layoutNubs() {
    const pad = parseFloat(getComputedStyle(root).getPropertyValue('--pad')) || 26;
    const half = 12;
    nubs.forEach(({ el, dir, i }) => {
      const mid = pad + cell * (i + 0.5) - half + 'px';
      const off = pad / 2 - half + 'px';
      if (dir === 'left')  { el.style.left = off;   el.style.top = mid; }
      if (dir === 'right') { el.style.right = off;  el.style.top = mid; }
      if (dir === 'up')    { el.style.top = off;    el.style.left = mid; }
      if (dir === 'down')  { el.style.bottom = off; el.style.left = mid; }
    });
  }

  /* ---------- 計時與計步 ---------- */
  const fmt = ms => {
    const s = ms / 1000;
    return s < 60 ? s.toFixed(2)
      : `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, '0')}`;
  };
  function tick() { elTime.textContent = fmt(performance.now() - startAt); }
  function bumpMove() {
    if (!running) { running = true; startAt = performance.now(); timerId = setInterval(tick, 40); }
    elMoves.textContent = ++moves;
  }

  function checkWin() {
    if (!isSolved()) return;
    solved = true; running = false;
    clearInterval(timerId);
    const ms = performance.now() - startAt;
    tick();
    lastRun = { ms: Math.round(ms), moves };
    document.getElementById('winTime').textContent = fmt(ms);
    document.getElementById('winSub').textContent = `${N}×${N} · 共 ${moves} 步`;
    openEntry();
    win.classList.add('on');
    if (best === null || ms < best) { best = ms; elBest.textContent = fmt(ms); saveBest(ms); }
  }

  /* ---------- 儲存層：Claude 預覽用 window.storage，一般網站用 localStorage ---------- */
  const store = (() => {
    if (window.storage) return {
      kind: 'claude',
      async get(k) { try { const r = await window.storage.get(k); return r && r.value != null ? r.value : null; } catch (e) { return null; } },
      async set(k, v) { try { await window.storage.set(k, v); } catch (e) {} }
    };
    let ok = true;
    try { localStorage.setItem('__probe', '1'); localStorage.removeItem('__probe'); } catch (e) { ok = false; }
    const mem = new Map();
    return {
      kind: ok ? 'local' : 'memory',
      async get(k) { try { return ok ? localStorage.getItem(k) : (mem.has(k) ? mem.get(k) : null); } catch (e) { return null; } },
      async set(k, v) { try { ok ? localStorage.setItem(k, v) : mem.set(k, v); } catch (e) {} }
    };
  })();

  /* ---------- 個人最佳（每種盤面分開） ---------- */
  async function loadBest() {
    const n = N;
    elBest.textContent = '—';
    best = null;
    const v = await store.get(`best-ms-${n}`);
    if (v && n === N) { best = Number(v); elBest.textContent = fmt(best); }
  }
  function saveBest(ms) { store.set(`best-ms-${N}`, String(ms)); }

  /* ---------- 打亂（只用合法步數，保證解得開） ---------- */
  function scramble() {
    const rounds = N === 3 ? 40 : 80;
    let last = '';
    for (let k = 0; k < rounds; k++) {
      const axis = Math.random() < 0.5 ? 'row' : 'col';
      const idx = Math.floor(Math.random() * N);
      const key = axis + idx;
      if (key === last && k) { k--; continue; }
      last = key;
      applyShift(axis, idx, Math.random() < 0.5 ? 1 : -1);
    }
    if (isSolved()) scramble();
  }

  function newGame() {
    win.classList.remove('on');
    clearInterval(timerId);
    moves = 0; running = false; solved = false; busy = false;
    elMoves.textContent = '0'; elTime.textContent = '0.00';
    scramble();
    render();
  }

  document.getElementById('shuffle').addEventListener('click', newGame);
  document.getElementById('again').addEventListener('click', newGame);
  document.getElementById('hint').addEventListener('click', e => {
    const on = board.classList.toggle('hint');
    e.currentTarget.setAttribute('aria-pressed', on);
  });

  /* ---------- 盤面大小切換 ---------- */
  const segBtns = [...document.querySelectorAll('#modeSeg button')];
  segBtns.forEach(b => b.addEventListener('click', () => setMode(+b.dataset.n)));

  function setMode(n) {
    N = n;
    root.style.setProperty('--n', n);
    segBtns.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.n === n)));
    document.getElementById('ruleMax').textContent = n * n;
    document.getElementById('rankMode').textContent = `${n}×${n}`;
    build();
    resize();
    newGame();
    loadBest();
    listEl.innerHTML = '<li class="msg">讀取中…</li>';
    loadRank();
    store.set('mode', String(n));
  }

  /* ---------- 排行榜：公開榜（leaderboard.json）+ 本機成績 ---------- */
  const PUBLIC_URL = './leaderboard.json';
  const MAX_ROWS = 50;   // 匯出檔保留筆數
  const TOP_N = 10;      // 畫面顯示筆數
  const listEl = document.getElementById('rankList');
  const footEl = document.getElementById('rankFoot');
  const whoEl  = document.getElementById('who');
  const postEl = document.getElementById('post');
  const noteEl = document.getElementById('note');

  let pub = null;                       // 公開榜 { 3:[], 4:[] }，null 表示還沒讀
  let pubOk = false;
  let mine = { 3: [], 4: [] };          // 本機成績
  let rows = [];                        // 目前顯示的合併結果
  let lastRun = null, myName = '';

  const clean = s => (s || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 8);
  const byScore = (a, b) => a.ms - b.ms || a.moves - b.moves;
  const p2 = v => String(v).padStart(2, '0');

  // 一筆成績的標準欄位：暱稱、時間、步數、日期、完成時刻、timestamp
  function normalize(e) {
    if (!e || typeof e !== 'object') return null;
    const name = clean(e.name);
    const ms = Math.round(Number(e.ms) || Number(e.seconds) * 1000 || 0);
    const moves = Math.round(Number(e.moves) || 0);
    if (!name || ms <= 0 || moves <= 0) return null;
    const ts = Number(e.timestamp) || Date.parse(e.iso || e.at || '') || Date.now();
    const d = new Date(ts);
    return {
      id: String(e.id || ts.toString(36) + Math.random().toString(36).slice(2, 6)),
      name, ms,
      seconds: +(ms / 1000).toFixed(2),
      moves,
      date: e.date || `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`,
      time: e.time || `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`,
      timestamp: ts,
      iso: d.toISOString(),
      local: !!e.local
    };
  }
  const strip = ({ local, ...rest }) => rest;

  // 併入成績：同代號只留最快的一局
  function mergeInto(list, incoming) {
    let added = 0;
    for (const raw of incoming) {
      const e = normalize(raw);
      if (!e) continue;
      const i = list.findIndex(x => x.name.toLowerCase() === e.name.toLowerCase());
      if (i < 0) { list.push(e); added++; }
      else if (byScore(e, list[i]) < 0) { list[i] = e; added++; }
    }
    list.sort(byScore);
    if (list.length > MAX_ROWS) list.length = MAX_ROWS;
    return added;
  }

  // 匯入時同時接受完整匯出檔、單一盤面物件或純陣列
  function extract(json) {
    const out = { 3: [], 4: [] };
    if (Array.isArray(json)) out[N] = json;
    else if (json && json.boards) {
      for (const [k, b] of Object.entries(json.boards)) {
        const n = Number(b && b.size) || (k.startsWith('4') ? 4 : 3);
        if (out[n]) out[n] = out[n].concat((b && b.entries) || []);
      }
    } else if (json && Array.isArray(json.entries)) {
      const n = Number(json.n || json.size) || N;
      if (out[n]) out[n] = json.entries;
    }
    return out;
  }

  /* ---------- 讀取兩個來源 ---------- */
  async function loadPublic() {
    if (pub) return pub;
    pub = { 3: [], 4: [] };
    try {
      const r = await fetch(PUBLIC_URL, { cache: 'no-cache' });
      if (r.ok) {
        const packs = extract(await r.json());
        pub = { 3: packs[3].map(e => ({ ...e, local: false })),
                4: packs[4].map(e => ({ ...e, local: false })) };
        pubOk = true;
      }
    } catch (e) { pubOk = false; }
    return pub;
  }

  async function loadMine() {
    for (const n of [3, 4]) {
      try {
        const v = await store.get(`scores-${n}`);
        const arr = v ? JSON.parse(v) : [];
        mine[n] = Array.isArray(arr) ? arr.map(e => normalize({ ...e, local: true })).filter(Boolean) : [];
      } catch (e) { mine[n] = []; }
    }
  }
  function saveMine(n) { store.set(`scores-${n}`, JSON.stringify(mine[n].map(strip))); }

  function combine(n) {
    const list = [];
    mergeInto(list, (pub && pub[n]) || []);
    mergeInto(list, mine[n]);
    return list;
  }

  async function loadRank() {
    const n = N;
    await loadPublic();
    if (n !== N) return;
    rows = combine(n);
    renderRank();
    footEl.textContent = pubOk
      ? `公開榜讀自 leaderboard.json。標「未送出」的是只存在這台瀏覽器的成績。`
      : `目前沒讀到 leaderboard.json（放在同一層即可），先顯示本機成績。`;
  }

  function renderRank(meId) {
    listEl.innerHTML = '';
    if (!rows.length) {
      listEl.innerHTML = `<li class="msg">${N}×${N} 還沒有成績。<br>第一局就是你的。</li>`;
      return;
    }
    rows.slice(0, TOP_N).forEach((e, i) => {
      const li = document.createElement('li');
      if (i < 3) li.className = 'top';
      if (e.id === meId) li.className += ' me';
      li.innerHTML =
        `<span class="r">${i + 1}</span><span class="nm"></span>` +
        `<span class="ms">${fmt(e.ms)}</span>` +
        `<span class="meta"><span>${e.moves} 步</span>` +
        `<span>${e.date} ${e.time}</span>` +
        (e.local ? '<span class="tag">未送出</span>' : '') + `</span>`;
      li.querySelector('.nm').textContent = e.name;
      listEl.appendChild(li);
    });
    const me = listEl.querySelector('.me');
    if (me) me.scrollIntoView({ block: 'nearest' });
  }

  /* ---------- 登錄成績 ---------- */
  function openEntry() {
    whoEl.value = myName;
    whoEl.disabled = false;
    postEl.disabled = !clean(myName);
    postEl.textContent = '記下成績';
    noteEl.textContent = '英數 1–8 字';
  }

  whoEl.addEventListener('input', () => {
    const v = clean(whoEl.value);
    if (v !== whoEl.value) whoEl.value = v;
    postEl.disabled = !v;
    noteEl.textContent = v ? '英數 1–8 字' : '代號只能用英文字母與數字';
  });
  whoEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !postEl.disabled) post(); });
  postEl.addEventListener('click', post);

  function post() {
    const name = clean(whoEl.value);
    if (!name || !lastRun) return;
    const n = N;
    postEl.disabled = true; whoEl.disabled = true;

    const rec = normalize({ name, ms: lastRun.ms, moves: lastRun.moves, timestamp: Date.now(), local: true });
    const kept = mergeInto(mine[n], [rec]) > 0;
    saveMine(n);
    store.set('player-name', name);
    myName = name;

    rows = combine(n);
    renderRank(kept ? rec.id : null);
    postEl.textContent = '已記下';
    const rank = rows.findIndex(e => e.id === rec.id) + 1;
    noteEl.textContent = !kept ? '這局比你的最佳成績慢，保留原紀錄'
      : rank && rank <= TOP_N ? `第 ${rank} 名 · 按「複製 JSON」可更新公開榜`
      : '已存在這台瀏覽器，按「複製 JSON」可更新公開榜';
  }

  /* ---------- 匯出／匯入 ---------- */
  async function exportAll() {
    await loadPublic();
    const boards = {};
    for (const n of [3, 4]) {
      boards[`${n}x${n}`] = { size: n, entries: combine(n).map(strip) };
    }
    return {
      schema: 'loop-puzzle.leaderboard',
      version: 3,
      exportedAt: new Date().toISOString(),
      boards
    };
  }

  const copyBtn = document.getElementById('copy');
  const loadBtn = document.getElementById('load');
  const fileEl  = document.getElementById('file');

  copyBtn.addEventListener('click', async () => {
    const json = JSON.stringify(await exportAll(), null, 2);
    try { await navigator.clipboard.writeText(json); copyBtn.textContent = '已複製'; }
    catch (err) { console.log(json); copyBtn.textContent = '看主控台'; }
    setTimeout(() => { copyBtn.textContent = '複製 JSON'; }, 1600);
  });

  loadBtn.addEventListener('click', () => fileEl.click());
  fileEl.addEventListener('change', async () => {
    const f = fileEl.files && fileEl.files[0];
    fileEl.value = '';
    if (!f) return;
    loadBtn.textContent = '匯入中…';
    let added = 0, bad = false;
    try {
      const packs = extract(JSON.parse(await f.text()));
      for (const n of [3, 4]) {
        if (!packs[n].length) continue;
        added += mergeInto(mine[n], packs[n].map(e => ({ ...e, local: true })));
        saveMine(n);
      }
      rows = combine(N);
      renderRank();
    } catch (err) { bad = true; }
    loadBtn.textContent = bad ? '檔案讀不動' : added ? `已加入 ${added} 筆` : '沒有新成績';
    setTimeout(() => { loadBtn.textContent = '匯入檔案'; }, 2200);
  });

  /* ---------- 啟動 ---------- */
  (async () => {
    await loadMine();
    const savedName = await store.get('player-name');
    if (savedName) myName = clean(savedName);
    const savedMode = await store.get('mode');
    setMode(Number(savedMode) === 4 ? 4 : 3);
  })();
})();

</script>
</body>
</html>
